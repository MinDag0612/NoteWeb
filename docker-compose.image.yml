services:
  backend:
    image: bkgamer1412/noteweb-backend:latest
    volumes:
    - uploads-data:/app/uploads
    env_file:
      - ./.env
    container_name: fastapi
    expose:
      - "8000"
    networks:
      - app-network

  frontend:
    image: bkgamer1412/noteweb-frontend:latest
    container_name: nginx-react
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

  mongodb:
    image: mongo:6.0
    container_name: mongodb
    env_file:
      - .env
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

networks:
  app-network:

volumes:
  mongo-data:
  uploads-data: